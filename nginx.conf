server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Headers de proxy
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Assets estáticos com hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Rotas de API do backend ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8080;
    }

    # Apenas o callback OAuth2 do Spring — NÃO inclui /auth/callback (rota do frontend)
    location /auth/refresh {
        proxy_pass http://api:8080;
    }

    location /auth/logout {
        proxy_pass http://api:8080;
    }

    location /oauth2/ {
        proxy_pass http://api:8080;
    }

    # Apenas o callback do Google para o Spring Security
    location /login/oauth2/ {
        proxy_pass http://api:8080;
    }

    # Vue Router — history mode — captura tudo o mais, incluindo /auth/callback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Segurança básica
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}